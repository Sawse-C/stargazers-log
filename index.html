<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Stargazers log</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="page">
      <header class="page-header">
        <p class="eyebrow">A collection of interesting projects</p>
        <h1>Starred repositories</h1>
        <p>A log of the repositories I've starred.</p>
      </header>
      <section aria-labelledby="repositories-heading">
        <h2 id="repositories-heading">Repositories</h2>
        <p id="repository-status" class="status" role="status" aria-live="polite">Loading repositories…</p>
        <ul id="repository-list" class="repository-list"></ul>
      </section>
    </main>
  </body>
</html>
